server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # deny all: retorna 403 para acesso direto por URL a /config/* e /pagina/* (fragmentos de layout).
    # Os include/require do PHP leem pelo disco, então continuam funcionando.
    # Fica ANTES do bloco "\.php$" porque o nginx usa a primeira location regex que casar.
    location ~ ^/(config|pagina)/ {
        deny all;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}